name: amusix
services:

  backend:
    build:
      context: AmusixBackapp/
      args:
        APP_BASE_URL: ${APP_BASE_URL:-http://localhost:2026}
        PG_HOST: ${PG_HOST}
        PG_PORT: ${PG_PORT}
        PG_DB: ${PG_DB}
        PG_USER: ${PG_USER}
        PG_PASSWORD: ${PG_PASSWORD}
        YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
        YOUTUBE_API_APP_NAME: ${YOUTUBE_API_APP_NAME}
    container_name: amx-api
    restart: unless-stopped
    stop_grace_period: 5s
    ports:
      - ":8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: AmusixFrontapp/
      args:
        APP_BASE_URL: ${APP_BASE_URL:-http://localhost:2026}
    container_name: amx-frontend
    restart: unless-stopped
    stop_grace_period: 5s
    ports:
      - ":80"
    depends_on:
      - backend

  proxy:
    image: nginx:alpine@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa
    container_name: amx-proxy
    restart: unless-stopped
    stop_grace_period: 5s
    depends_on:
      - backend
      - frontend
    ports:
      - "2026:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
    entrypoint:
      - nginx
    command:
      - -g
      - daemon off;